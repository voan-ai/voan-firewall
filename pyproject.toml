[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voan"
version = "0.1.11"
description = "Voan Firewall — runtime guard for AI agents. Sits inline on every tool call and blocks unauthorized actions (RCE, exfiltration, data loss) before they execute."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Voan" }]
keywords = ["ai-security", "llm-security", "agentic", "agent-firewall",
            "runtime-security", "mcp", "owasp-agentic", "guardrails"]
# The SDK itself is pure stdlib — zero runtime dependencies on purpose, so it is
# safe to drop into any agent process.
dependencies = []

[project.optional-dependencies]
# Only needed to run the live dashboard (server/app.py).
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
# Only needed to run the LangChain adapter demo (demo/langchain_demo.py).
langchain = ["langchain-core>=0.2"]
# Only needed to run the example scripts (real-agent attacks, MCP demo).
examples = ["openai>=1.0", "mcp>=1.0"]
# Only needed to guard MCP client sessions (voan.adapters.guard_mcp).
mcp = ["mcp>=1.0"]
# Only needed to SERVE the transparent proxy over HTTP (voan-mcp-proxy --serve-http).
proxy-http = ["mcp>=1.0", "uvicorn>=0.29", "starlette>=0.37"]
# Dev tooling: tests, coverage, lint. `pip install -e ".[dev,mcp]"` then `pytest`.
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/voan-ai/voan-firewall"
Repository = "https://github.com/voan-ai/voan-firewall"
Issues = "https://github.com/voan-ai/voan-firewall/issues"

[project.scripts]
# Transparent MCP firewall proxy: voan-mcp-proxy --allow acme.com -- <server cmd>
voan-mcp-proxy = "voan.mcp_proxy:main"

[tool.setuptools]
packages = ["voan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort
[tool.ruff.lint.per-file-ignores]
# Benchmarks/evals/demos favour compact one-liners and wide output strings; the
# library code (voan/) and the test suite stay strictly clean.
"benchmark/*" = ["E501", "E701", "E702", "E731", "E741", "F841"]
"eval/*" = ["E501", "E701", "E702", "E731", "E741"]
"examples/*" = ["E501", "E702"]
"demo/*" = ["E501"]
"tests/*" = ["E701", "E702", "E731"]
