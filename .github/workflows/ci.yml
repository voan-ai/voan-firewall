name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Static quality gates: lint (ruff) + strict type-check of the shipped JS library.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff lint
        run: pip install ruff && ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: TypeScript strict type-check (library)
        run: cd sdk-js && npm install -D typescript @types/node && npx tsc --noEmit

  # Core test suite across every Python the package claims to support (>=3.9).
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK + test deps
        run: pip install -e ".[dev]" pytest-cov
      - name: Unit tests + coverage (no API key needed — judge is stubbed)
        run: pytest --cov=voan --cov-report=term-missing --cov-fail-under=75
      - name: Demo blocks the attacks end-to-end
        run: python demo/demo_agent.py

  # The MCP adapter test needs the optional `mcp` package (Python >=3.10).
  python-mcp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK + test + mcp
        run: pip install -e ".[dev,mcp]"
      - name: Unit tests (includes guard_mcp)
        run: pytest

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JS parity, judge, adapter, and plan suites
        run: |
          node sdk-js/verify.ts
          node sdk-js/judge_verify.ts
          node sdk-js/adapters_verify.ts
          node sdk-js/plan_verify.ts
          node sdk-js/auto_verify.ts
          node sdk-js/parity_verify.ts
      - name: JS demo blocks the attacks
        run: node sdk-js/demo.ts
